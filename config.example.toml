# Srotas configuration — copy this file to `config.toml` (gitignored) and fill
# in your keys. The shape grows one roadmap phase at a time; only what the
# shipped phases use is listed here. Later phases add the Voyage and Anthropic
# API keys, the cosine relevance threshold, the collection interval, the weight
# deltas, and the topic blacklist (ARCHITECTURE.md §Configuration).

# v0.2 — the Guardian Open Platform key (free developer tier).
# Request one at https://open-platform.theguardian.com/access/
[guardian]
api_key = "your-guardian-open-platform-key"

# v0.3 — the Voyage AI key for embeddings (model voyage-3, shared vector space
# with Lumi's RAG). Request one at https://dashboard.voyageai.com/
[voyage]
api_key = "your-voyage-api-key"

# v0.3 — scoring: the relevance gate on the pure cosine (calibrate with the CLI
# preview, `python -m core.scoring --preview`). It ranks nothing — weight does;
# it only decides whether an item is eligible for a node at all.
[scoring]
threshold = 0.35

# v0.4 — how often the in-process scheduler runs collect → embed → score.
[schedule]
interval_hours = 4

# v0.5 — the Anthropic key for the feedback classifier (Haiku-class model);
# reused by feed translation in phase 0.8. Request one at https://console.anthropic.com/
[anthropic]
api_key = "your-anthropic-api-key"

# v0.5 — the weight deltas a like/dislike applies to a card's top_node,
# clamped to [0.05, 1.0]. The asymmetry is deliberate — a negative signal is
# more informative and guards against weight inflation.
[feedback]
like_delta = 0.05
dislike_delta = -0.07
