<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Srotas — стрічка</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
  <style>
    :root{color-scheme:dark}
    body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:0 auto;padding:1rem;background:#0e1413;color:#e9f0ee;line-height:1.5}
    a{color:#34d6c0}
    header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem}
    header h1{font-size:1.4rem;margin:0}
    .day h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:#90a29e;border-bottom:1px solid #223331;padding-bottom:.3rem;margin:1.4rem 0 .6rem;font-variant-numeric:tabular-nums}
    .card{background:#151d1c;border:1px solid #223331;border-radius:12px;padding:1rem;margin:.6rem 0}
    .tag{display:inline-block;font-size:.72rem;color:#7fe6d5;background:#34d6c012;border:1px solid #34d6c030;border-radius:999px;padding:.15rem .55rem;text-decoration:none}
    .tag:hover{background:#34d6c022}
    .card h3{margin:.45rem 0 .25rem;font-size:1.08rem;line-height:1.3}
    .card h3 a{text-decoration:none}
    .card h3 a:hover{text-decoration:underline}
    .meta{color:#90a29e;font-size:.8rem;margin:.15rem 0 .4rem;font-variant-numeric:tabular-nums}
    .summary{color:#c4d0cd;font-size:.92rem;margin:.3rem 0 .6rem}
    .feedback input{width:100%;padding:.45rem;border-radius:8px;border:1px solid #223331;background:#0e1413;color:#e9f0ee;box-sizing:border-box;transition:border-color .15s ease,background-color .15s ease}
    .feedback.htmx-request input{border-color:#34d6c0;background:#132420;cursor:wait}
    .feedback input:disabled{opacity:.6;cursor:wait}
    .empty{color:#90a29e}
  </style>
</head>
<body>
  <header>
    <h1>Srotas</h1>
    {% if node %}<a href="/">всі</a>{% endif %}
  </header>
  {% for day, cards in days %}
  <section class="day">
    <h2>{{ day }}</h2>
    {% for item in cards %}{% include "_card.html" %}{% endfor %}
  </section>
  {% else %}
  <p class="empty">Порожньо — ще нема оцінених статей.</p>
  {% endfor %}
</body>
</html>
